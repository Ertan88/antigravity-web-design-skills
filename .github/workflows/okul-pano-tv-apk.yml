# Okul Yayın Pano: TV'de panoyu tam ekran açan Android TV uygulaması (APK).
# Elle çalıştırılabilir (Actions › "Okul Pano · TV uygulaması" › Run workflow) ya da TV kodu değişince kendiliğinden çalışır.
# Çıkan APK, deponun Releases sayfasındaki "okul-pano-tv" sürümüne yüklenir. TV'de "Downloader" uygulamasına
# sunucunun kısa adresi (ör. okul-pano.onrender.com/tv) yazılınca bu dosya iner.
name: Okul Pano · TV uygulaması

on:
  workflow_dispatch:
  push:
    branches: [claude/okul-dijital-pano-4oao0y]
    paths:
      - okul-pano/tv/**
      - .github/workflows/okul-pano-tv-apk.yml

permissions:
  contents: write

concurrency:
  group: okul-pano-tv-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Uygulamanın açtığı varsayılan sunucu (TV'de gizli ayarlardan değiştirilebilir)
      PANOKUL_API_URL: ${{ vars.PANOKUL_API_URL || 'https://okul-pano.onrender.com' }}
    defaults:
      run:
        working-directory: okul-pano/tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Kalıcı imza anahtarı (varsa)
        # Secrets › TV_KEYSTORE_BASE64 (keystore dosyasının base64 hali), TV_KEYSTORE_PASSWORD, TV_KEY_ALIAS, TV_KEY_PASSWORD.
        # Tanımlı değilse depodaki geliştirme anahtarıyla imzalanır (deneme için yeterli).
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TV_KEYSTORE_BASE64" ]; then
            printf '%s' "$TV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pano.keystore"
            echo "TV_KEYSTORE_FILE=$RUNNER_TEMP/pano.keystore" >> "$GITHUB_ENV"
            echo "Kalıcı imza anahtarı kullanılıyor"
          else
            echo "::warning::TV_KEYSTORE_BASE64 tanımlı değil: APK geliştirme anahtarıyla imzalandı"
          fi

      - name: APK derle
        env:
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Okul-Yayin-Pano.apk

      - uses: actions/upload-artifact@v4
        with:
          name: okul-yayin-pano-apk
          path: okul-pano/tv/Okul-Yayin-Pano.apk

      - name: Sürüm sayfasına yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=okul-pano-tv
          TITLE="Okulyayın · Pano (Android TV)"
          NOTES="TV'de panoyu tam ekran açan uygulama. TV'de Downloader uygulamasına sunucunuzun kısa adresini (ör. okul-pano.onrender.com/tv) yazın, inen dosyayı kurup açın ve ekrandaki kodla panoyu eşleştirin."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" "Okul-Yayin-Pano.apk#Okul Yayın Pano" --clobber
