# Okul Pano Docker imajı: derlenir, PostgreSQL ile ve VPS kurulum betiğiyle denenir, geçerse
# GitHub Container Registry'ye (ghcr.io/ertan88/okul-pano) gönderilir. VPS kurulumu bu hazır imajı indirir.
name: Okul Pano · Docker imajı

on:
  workflow_dispatch:
  push:
    branches: [claude/okul-dijital-pano-4oao0y]
    paths:
      - okul-pano/**
      - '!okul-pano/docs/**'
      - '!okul-pano/**/*.md'
      - .github/workflows/okul-pano-docker.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: okulpano
          POSTGRES_PASSWORD: okulpano
          POSTGRES_DB: okulpano
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U okulpano" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: İmajı derle
        run: docker build -t okul-pano:ci okul-pano
      - name: Açılışı dene (boş PostgreSQL, görseller veritabanında, örnek okul kurulur)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://okulpano:okulpano@localhost:5432/okulpano \
            -e JWT_SECRET=ci-denemesi-icin-en-az-otuz-iki-karakterlik-anahtar \
            -e FILE_STORAGE=db -e SEED_DEMO=true \
            -e SEED_SUPERADMIN_EMAIL=ci@ornek.com -e SEED_SUPERADMIN_PASSWORD=Ci-Deneme-2026 \
            okul-pano:ci
          for i in $(seq 1 60); do curl -fs localhost:3000/api/health && break; sleep 2; done
          echo
          for p in /admin/ /display/ /app/; do curl -fs -o /dev/null "localhost:3000$p"; echo "$p tamam"; done
          docker logs app | grep "İlk açılış"
          T=$(curl -fs -X POST localhost:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"mudur@okulpano.local","password":"Ci-Deneme-2026"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["accessToken"])')
          SID=$(curl -fs localhost:3000/api/me -H "authorization: Bearer $T" | python3 -c 'import json,sys;print(json.load(sys.stdin)["schools"][0]["id"])')
          IMG=$(curl -fs "localhost:3000/api/schools/$SID/announcements" -H "authorization: Bearer $T" \
            | python3 -c 'import json,sys;print([a["imageUrl"] for a in json.load(sys.stdin) if a.get("imageUrl")][0])')
          curl -fs -o /dev/null -w "görsel %{http_code} %{content_type} %{size_download} bayt\n" "localhost:3000$IMG"
          # Bilinen geliştirme şifresi internete açık kurulumda çalışmamalı
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"mudur@okulpano.local","password":"Mudur2026!"}')" = 401
          echo "eski şifre reddedildi"
      - name: Sunucu kaydı
        if: always()
        run: docker logs app 2>&1 | grep -v '"level":30' | tail -40 || true

      - name: VPS kurulum betiğini dene (kurulum, HTTPS, yedek, geri yükleme, güncelleme)
        run: |
          docker rm -f app
          sudo OKULPANO_IMAGE=okul-pano:ci DOMAIN=localhost ADMIN_EMAIL=ci@ornek.com \
            ADMIN_PASSWORD=Ci-Deneme-2026-uzun SEED_DEMO=evet bash okul-pano/deploy/kurulum.sh
          curl -fsk https://localhost/api/health
          curl -fsk -o /dev/null https://localhost/admin/
          echo " · HTTPS panel tamam"
          # İlk açılıştan sonra yönetici şifresi sunucuda düz metin olarak kalmamalı
          if sudo grep -q SEED_SUPERADMIN_PASSWORD /opt/okul-pano/.env; then echo "HATA: şifre .env'de kaldı"; exit 1; fi
          echo "şifre .env'den silindi"
          curl -fsk -X POST https://localhost/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci@ornek.com","password":"Ci-Deneme-2026-uzun"}' -o /dev/null
          echo "yönetici girişi tamam"
          sudo ls -la /opt/okul-pano/yedekler
          test -f /etc/cron.d/okul-pano
          echo "gece yedeği zamanlandı"
          # Geri yükleme: veriyi sil, yedeği yükle, geri geldiğini gör
          f=$(sudo ls /opt/okul-pano/yedekler | head -1)
          cd /opt/okul-pano
          count() { sudo docker compose exec -T db psql -U okulpano -d okulpano -tAc 'select count(*) from announcements'; }
          before=$(count)
          sudo docker compose exec -T db psql -U okulpano -d okulpano -c 'delete from announcements'
          test "$(count)" = 0
          sudo ONAY=evet ./geri-yukle.sh "yedekler/$f"
          after=$(count)
          if [ "$after" != "$before" ] || [ "$after" = 0 ]; then echo "HATA: geri yükleme ($before → $after)"; exit 1; fi
          echo "geri yükleme tamam ($after duyuru)"
          # Betik ikinci kez çalışınca güncelleme yapar, kurulumu bozmaz
          cd "$GITHUB_WORKSPACE"
          sudo OKULPANO_IMAGE=okul-pano:ci bash okul-pano/deploy/kurulum.sh
          for i in $(seq 1 60); do curl -fsk https://localhost/api/health >/dev/null && break; sleep 2; done
          curl -fsk https://localhost/api/health
          echo " · güncelleme sonrası açık"

      - name: GitHub Container Registry'ye gönder
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "${GITHUB_SHA::7}"; do
            docker tag okul-pano:ci "ghcr.io/ertan88/okul-pano:$tag"
            docker push "ghcr.io/ertan88/okul-pano:$tag"
          done
