# PayFlow Android APK'sını derler ve Releases sayfasına yükler.
# payflow/ altında bir değişiklik push'landığında veya Actions sekmesinden elle çalıştırıldığında çalışır.
# Firebase kullanılacaksa değerler: Settings › Secrets and variables › Actions › Variables
# (EXPO_PUBLIC_FIREBASE_API_KEY vb., bkz. payflow/.env.example). Girilmezse uygulama hesapsız modda çalışır.
name: PayFlow · APK derle

on:
  push:
    paths:
      - 'payflow/**'
      - '.github/workflows/payflow-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # Release oluşturmak için

concurrency:
  group: payflow-apk-${{ github.ref }}
  cancel-in-progress: false # yeni push, süren derlemeyi iptal etmez; sıraya girer

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: payflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payflow/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler ve tip kontrolü
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: APK derle
        working-directory: payflow/android
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        # Test APK'sı yalnızca 64-bit telefonlar için (son yıllardaki neredeyse tüm Android cihazlar):
        # boyut ~%40 küçülür, derleme hızlanır. Mağaza (AAB) tüm mimarileri içerir; Play her cihaza
        # yalnızca kendi parçasını gönderir.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: APK'yı adlandır
        id: apk
        run: |
          NAME="PayFlow-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: PayFlow-apk
          path: payflow/${{ steps.apk.outputs.name }}
          retention-days: 30

      # Depo ayarı: Settings › Actions › General › Workflow permissions → "Read and write".
      # Bu ayar kapalıysa yükleme 403 verir; APK yine yukarıdaki artifact'tan indirilebilir.
      - name: Release'e yükle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="payflow-build-${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "PayFlow APK · derleme ${{ github.run_number }}" \
            --notes "Dal: ${{ github.ref_name }} · commit ${{ github.sha }}. Telefona kurmak için APK dosyasını indir; bilinmeyen kaynaklardan yüklemeye izin vermen gerekebilir. Test sürümüdür (hata ayıklama anahtarıyla imzalı)."
