# Okul Yayın · yerel Android uygulaması (Kotlin + Jetpack Compose, Material Design 3).
# Çekirdek testleri, ekran görüntüleri (açık / koyu tema) ve APK; hepsi "okul-pano-compose" sürüm sayfasına yüklenir.
name: Okul Pano · Compose APK

on:
  workflow_dispatch:
  push:
    branches: [claude/okul-dijital-pano-4oao0y]
    paths:
      - okul-pano/android-app/**
      - .github/workflows/okul-pano-compose.yml

permissions:
  contents: write

concurrency:
  group: okul-pano-compose
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Uygulamanın bağlandığı sunucu (Expo uygulamasıyla aynı değişken)
      API_URL: ${{ vars.PANOKUL_API_URL || 'https://okul-pano.onrender.com' }}
      # Expo sürümünün (versionCode 1) üzerine güncelleme olarak kurulsun diye her derlemede artar
      VERSION_CODE: ${{ github.run_number }}00
    defaults:
      run:
        working-directory: okul-pano/android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Çekirdek testleri (zil, okul günü, API istemcisi)
        run: ./gradlew -p core test --no-daemon

      - name: APK derle
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Ekran görüntüleri (Roborazzi, açık ve koyu tema)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Dosyaları hazırla
        if: always()
        run: |
          mkdir -p out/ekranlar
          cp app/build/outputs/apk/release/app-release.apk out/Okul-Yayin-Compose.apk 2>/dev/null || true
          cp app/build/outputs/roborazzi/*.png out/ekranlar/ 2>/dev/null || true
          (cd out && zip -qr ekranlar.zip ekranlar) || true
          ls -la out out/ekranlar || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okul-yayin-compose
          path: |
            okul-pano/android-app/out/
            okul-pano/android-app/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Sürüm sayfasına yükle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=okul-pano-compose
          TITLE="Okulyayın · Android (Compose, Material 3)"
          NOTES="Yerel Android uygulaması (Kotlin + Jetpack Compose, Material Design 3, açık / koyu tema). Okul-Yayin-Compose.apk dosyasını telefona indirip kurun; Expo sürümünün üzerine güncelleme olarak kurulur. Ekran görüntüleri ekranlar.zip içinde."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" out/Okul-Yayin-Compose.apk out/ekranlar.zip out/ekranlar/*.png --clobber
